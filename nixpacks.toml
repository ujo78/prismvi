[phases.setup]
nixPkgs = ["python311", "nodejs", "gcc", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "npm install --omit=dev",
  "python -m venv .venv",
  ". .venv/bin/activate && pip install --upgrade pip",
  ". .venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = ". .venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT dng_backend:app"
