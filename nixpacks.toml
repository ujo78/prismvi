[phases.setup]
nixPkgs = ["python311", "nodejs"]

[phases.install]
cmds = [
  "npm install --omit=dev",
  "python -m venv .venv",
  ". .venv/bin/activate && pip install --upgrade pip",
  ". .venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = ". .venv/bin/activate && python dng_backend.py"
